app:
  name: "Alderwood University Hybrid RAG"
  environment: "development"
  current_date_override: "2026-11-23"

feature_flags:
  use_hyde: true
  use_reranker: true
  use_crag_grader: true
  use_llm_claim_check: true
  use_schema_index: true

models:
  fast_model_env: "FAST_MODEL"
  strong_model_env: "STRONG_MODEL"
  default_fast_model: "gemini-3.5-flash-lite"
  default_strong_model: "gemini-3.5-flash-lite"
  embedding_model: "BAAI/bge-m3"
  reranker_model: "BAAI/bge-reranker-v2-m3"
  embedding_dim: 1024

database:
  postgres_port: 5432
  sqlite_mirror_path: "data/university.db"
  statement_timeout_ms: 5000
  lock_timeout_ms: 2000
  max_rows: 100
  allowlisted_tables:
    - departments
    - students
    - courses
    - enrollments
    - grants
    - fee_ledger
    - timetable
    - grant_applications
    - grant_history
    - grant_reviewers
    - fees
    - fee_waivers
    - student_semester_gpas
    - student_awards
    - faculty_mentors
    - research_labs
    - academic_calendar
    - scholarships_archive

ingestion:
  pdf_dir: "data/pdfs"
  chunk_size_tokens: 420
  chunk_overlap_tokens: 60
  table_heavy_docs:
    - "05_tuition_fees_and_waiver_handbook.pdf"

retrieval:
  schema_top_k: 3
  vector_top_k: 12
  fts_top_k: 12
  rrf_k: 60
  rerank_top_k: 5
  rerank_score_threshold: 0.42
  sequential_max_grant_ids: 5

router:
  exemplar_similarity_threshold: 0.78

sql_branch:
  max_retries: 3

synthesis:
  max_regeneration_attempts: 1

eval:
  gold_path: "eval/gold.jsonl"
  report_output_path: "eval/latest_report.json"
